<script>
    function editProfile() {
        document.querySelector(".container").style.display = "none";
        document.querySelector(".container-edit").style.display = "block";

        const name = document.querySelector("#name").textContent;
        document.querySelector("#input-name").value = name;

        const email = document.querySelector("#email").textContent;
        document.querySelector("#input-email").value = email;

        const interests = document.querySelector("#interests").textContent;
        document.querySelector("#input-interests").value = interests;

        const header = document.querySelector("#header").textContent;
        document.querySelector("#input-header").value = header;
    }

    function saveProfile() {
        document.querySelector("#name").textContent =
            document.querySelector("#input-name").value;
        document.querySelector("#email").textContent =
            document.querySelector("#input-email").value;
        document.querySelector("#interests").textContent =
            document.querySelector("#input-interests").value;
        document.querySelector("#header").textContent =
            document.querySelector("#input-header").value;
        document.querySelector(".container").style.display = "block";
        document.querySelector(".container-edit").style.display = "none";
    }
</script>
<html>
    <head>
        <style>
            .container-edit {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 id="header">Zirnis Curriculum vitae</h1>
            <img
                src="static/profile.jpg"
                style="width: 1080px; height: 720px"
            />
            <hr />
            NAME:
            <h3 id="name">Eriks Zirnis</h3>
            <hr />
            EMAIL:
            <h3 id="email">erikszirnis11@gmail.com</h3>
            <hr />
            Interests:
            <h3 id="interests">
                Cycling, Running, Ice Hockey and becoming DEVOPS
            </h3>
            <hr />
            <button class="button" onclick="editProfile()">
                CREATE YOURS CV
            </button>
        </div>
        <div class="container-edit">
            <form method="POST" action="/">
                <h1>
                    <input id="input-header" type="text" /> Curriculum Vitae
                </h1>
                <img
                    src="static/profile.jpg"
                    style="width: 1080px; height: 720px"
                />
                NAME: <input id="input-name" type="text" name="name" />
                <hr />
                EMAIL:<input id="input-email" type="email" name="email" />
                <hr />
                Interests:
                <input id="input-interests" type="interests" name="interests" />
                <hr />
                <button class="button" onclick="saveProfile()">SAVE CV</button>
            </form>
        </div>
    </body>
</html>
